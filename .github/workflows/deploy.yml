name: Deploy

# develop -> dev (Worker practice-buddy-dev on workers.dev); main -> prod (custom domain from deployment.json, if set).
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      apply_infra:
        description: Run tofu apply even if infra/ did not change (needed for the very first deploy)
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deploys at once (they share one OpenTofu state); never cancel one mid-flight.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Nothing touches Cloudflare until the architect sets the repo variable DEPLOY_ENABLED=true (docs/deploy.md).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Which environment this push deploys to.
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      # Secrets can't be used in `if:` directly. Without them the job still succeeds (skipping
      # every deploy step) so main stays green until the architect adds the secrets.
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check secrets
        run: |
          if [ "$HAS_CF_SECRETS" != "true" ]; then
            echo "::notice::Cloudflare secrets are not configured; skipping deploy (see docs/deploy.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CF_SECRETS == 'true'
        with:
          fetch-depth: 0

      # ---- OpenTofu: only when infra/ changed in this push ----
      - name: Did infra/ change?
        id: infra
        if: env.HAS_CF_SECRETS == 'true'
        env:
          BEFORE: ${{ github.event.before }}
          APPLY_INFRA: ${{ inputs.apply_infra }}
        run: |
          if [ "$APPLY_INFRA" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # First push / unknown base: assume changed.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- infra; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: env.HAS_CF_SECRETS == 'true' && steps.infra.outputs.changed == 'true'
        with:
          tofu_version: 1.13.9
      # R2 S3 credentials for the state backend are derived from the API token itself
      # (https://developers.cloudflare.com/r2/api/tokens/): Access Key ID = the token's id,
      # Secret Access Key = SHA-256 hex of the token value.
      - name: Derive R2 state credentials from the API token
        if: env.HAS_CF_SECRETS == 'true' && steps.infra.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Account-owned tokens verify at the account endpoint; user tokens at /user.
          verify() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1/tokens/verify"; }
          ID=$(verify "accounts/$ACCOUNT_ID" 2>/dev/null | jq -r '.result.id // empty' || true)
          [ -n "$ID" ] || ID=$(verify user | jq -r '.result.id // empty')
          if [ -z "$ID" ]; then echo "::error::Could not read the API token id from tokens/verify"; exit 1; fi
          SECRET=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$ID"
          echo "::add-mask::$SECRET"
          {
            echo "AWS_ACCESS_KEY_ID=$ID"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET"
          } >> "$GITHUB_ENV"
      - name: tofu apply
        if: env.HAS_CF_SECRETS == 'true' && steps.infra.outputs.changed == 'true'
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tofu init -input=false -backend-config="endpoints={s3=\"https://${ACCOUNT_ID}.r2.cloudflarestorage.com\"}"
          tofu apply -input=false -auto-approve

      # ---- Worker ----
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: env.HAS_CF_SECRETS == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_CF_SECRETS == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.HAS_CF_SECRETS == 'true'
      # prod: default wrangler config (Worker practice-buddy + custom domain).
      # dev: CLOUDFLARE_ENV=dev bakes env.dev (Worker practice-buddy-dev + dev bucket, no custom domain).
      - name: Build
        if: env.HAS_CF_SECRETS == 'true'
        run: |
          if [ "$DEPLOY_ENV" = "dev" ]; then export CLOUDFLARE_ENV=dev; fi
          pnpm build
      # The Worker's COOKIE_SIGNING_KEY comes from GitHub secrets and is uploaded together with the
      # deploy (--secrets-file), so a brand-new Worker has its key from its first version.
      - name: Prepare Worker secrets file
        if: env.HAS_CF_SECRETS == 'true'
        env:
          KEY_DEV: ${{ secrets.COOKIE_SIGNING_KEY_DEV }}
          KEY_PROD: ${{ secrets.COOKIE_SIGNING_KEY_PROD }}
        run: |
          if [ "$DEPLOY_ENV" = "prod" ]; then KEY="$KEY_PROD"; NAME=COOKIE_SIGNING_KEY_PROD; else KEY="$KEY_DEV"; NAME=COOKIE_SIGNING_KEY_DEV; fi
          if [ "${#KEY}" -lt 32 ]; then
            echo "::error::GitHub secret $NAME is missing or shorter than 32 chars (see docs/deploy.md)."
            exit 1
          fi
          umask 077
          jq -n --arg k "$KEY" '{COOKIE_SIGNING_KEY: $k}' > "$RUNNER_TEMP/worker-secrets.json"
      - name: wrangler deploy
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy --secrets-file ${{ runner.temp }}/worker-secrets.json
