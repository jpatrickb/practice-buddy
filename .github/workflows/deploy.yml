name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never run two production deploys at once; never cancel one mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Nothing touches Cloudflare until the architect sets the repo variable DEPLOY_ENABLED=true (docs/deploy.md).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Secrets can't be used in `if:` directly. Without them the job still succeeds (skipping
      # every deploy step) so main stays green until the architect adds the secrets.
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_STATE_SECRETS: ${{ secrets.TF_STATE_ACCESS_KEY_ID != '' && secrets.TF_STATE_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Check secrets
        run: |
          if [ "$HAS_CF_SECRETS" != "true" ]; then
            echo "::notice::Cloudflare secrets are not configured; skipping deploy (see docs/deploy.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CF_SECRETS == 'true'
        with:
          fetch-depth: 0

      # ---- OpenTofu: only when infra/ changed in this push ----
      - name: Did infra/ change?
        id: infra
        if: env.HAS_CF_SECRETS == 'true'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # First push / unknown base: assume changed.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- infra; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: env.HAS_CF_SECRETS == 'true' && env.HAS_STATE_SECRETS == 'true' && steps.infra.outputs.changed == 'true'
        with:
          tofu_version: 1.13.9
      - name: tofu apply
        if: env.HAS_CF_SECRETS == 'true' && env.HAS_STATE_SECRETS == 'true' && steps.infra.outputs.changed == 'true'
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # R2 S3-API credentials for the state bucket
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tofu init -input=false -backend-config="endpoints={s3=\"https://${ACCOUNT_ID}.r2.cloudflarestorage.com\"}"
          tofu apply -input=false -auto-approve

      # ---- Worker ----
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: env.HAS_CF_SECRETS == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_CF_SECRETS == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.HAS_CF_SECRETS == 'true'
      - run: pnpm build
        if: env.HAS_CF_SECRETS == 'true'
      - name: wrangler deploy (production)
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
      # Keep the preview worker current so PR previews (versions upload) have a worker to attach to.
      - name: Build preview worker
        if: env.HAS_CF_SECRETS == 'true'
        run: CLOUDFLARE_ENV=preview pnpm build
      - name: wrangler deploy (preview worker)
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
