name: PR (uploads to the dev Worker)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  preview:
    needs: ci
    # Same-repo PRs only: fork PRs never get secrets, and PR code must not run with them unreviewed.
    # Also gated on the repo variable DEPLOY_ENABLED (docs/deploy.md): nothing touches Cloudflare until it is 'true'.
    if: vars.DEPLOY_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Forks and repos without secrets skip cleanly.
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check secrets
        run: |
          if [ "$HAS_CF_SECRETS" != "true" ]; then
            echo "::notice::Cloudflare secrets not available; skipping preview upload."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CF_SECRETS == 'true'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: env.HAS_CF_SECRETS == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_CF_SECRETS == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.HAS_CF_SECRETS == 'true'
      # CLOUDFLARE_ENV=dev bakes env.dev (Worker practice-buddy-dev + dev R2 bucket)
      # into the build, so a preview can never read or write production content.
      - run: CLOUDFLARE_ENV=dev pnpm build
        if: env.HAS_CF_SECRETS == 'true'
      - name: Upload preview version
        id: upload
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: versions upload --name practice-buddy-dev --preview-alias pr-${{ github.event.pull_request.number }} --message "PR #${{ github.event.pull_request.number }}"
      - name: Comment preview URL
        if: env.HAS_CF_SECRETS == 'true' && steps.upload.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTPUT: ${{ steps.upload.outputs.command-output }}
        with:
          script: |
            const out = process.env.OUTPUT || '';
            const alias = out.match(/https:\/\/pr-\d+-[^\s]+\.workers\.dev/);
            const url = alias ? alias[0] : (out.match(/https:\/\/[^\s]+\.workers\.dev/) || [])[0];
            const marker = '<!-- practice-buddy-preview -->';
            const body = `${marker}\n**Preview:** ${url ?? '(uploaded, but the URL could not be parsed; see the workflow log)'}\n\nPreview uses the *dev* R2 bucket and the dev Worker's \`COOKIE_SIGNING_KEY\`.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
