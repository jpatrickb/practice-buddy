<!doctype html>
<html lang="en" data-dir="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Buddy Styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Manrope:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
/* ===== Tokens. Each direction owns a prefix: st- (Studio), np- (Now Playing), pl- (Playlist). ===== */
:root {
  color-scheme: light dark;
  /* Studio is dark-only: same values in every mode */
  --st-bg:#0a0c12; --st-card:#141824; --st-card2:#1c2235; --st-line:#262d44; --st-fg:#eef1f8; --st-mut:#a0abc4; --st-acc:#5d6cff;
  /* Now Playing */
  --np-bg:#f4effc; --np-fg:#1d1535; --np-mut:#574f73; --np-glass:rgba(255,255,255,.58); --np-line:rgba(60,30,120,.16);
  --np-acc:#5b3fe0; --np-accfg:#fff; --np-track:rgba(60,30,120,.18); --np-oL:74%; --np-oA:.8;
  /* Playlist */
  --pl-bg:#fff; --pl-fg:#0b0b10; --pl-mut:#5b5e68; --pl-card:#f3f3f6; --pl-line:#e2e2e8;
  --pl-acc:#d6361f; --pl-accfg:#fff; --pl-track:#dcdce3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --np-bg:#0f0b1d; --np-fg:#f4f1ff; --np-mut:#bdb5da; --np-glass:rgba(255,255,255,.08); --np-line:rgba(255,255,255,.16);
    --np-acc:#a99bff; --np-accfg:#14102a; --np-track:rgba(255,255,255,.2); --np-oL:44%; --np-oA:.6;
    --pl-bg:#0b0b10; --pl-fg:#f6f6f8; --pl-mut:#a7a9b4; --pl-card:#17171e; --pl-line:#2a2a34;
    --pl-acc:#ff6a4d; --pl-accfg:#1d0600; --pl-track:#34343f;
  }
}
:root[data-theme="dark"] {
  --np-bg:#0f0b1d; --np-fg:#f4f1ff; --np-mut:#bdb5da; --np-glass:rgba(255,255,255,.08); --np-line:rgba(255,255,255,.16);
  --np-acc:#a99bff; --np-accfg:#14102a; --np-track:rgba(255,255,255,.2); --np-oL:44%; --np-oA:.6;
  --pl-bg:#0b0b10; --pl-fg:#f6f6f8; --pl-mut:#a7a9b4; --pl-card:#17171e; --pl-line:#2a2a34;
  --pl-acc:#ff6a4d; --pl-accfg:#1d0600; --pl-track:#34343f;
}
/* Map a direction's prefixed tokens onto generic names */
[data-dir="studio"] { --bg:var(--st-bg); --fg:var(--st-fg); --mut:var(--st-mut); --card:var(--st-card); --card2:var(--st-card2); --line:var(--st-line); --acc:var(--st-acc); --accfg:#fff;
  --track:#2b3350; --fill:var(--st-acc); --thumb:#fff; --tick:#6b7699; --font:'Manrope',system-ui,sans-serif; --r:22px; }
[data-dir="now"] { --bg:var(--np-bg); --fg:var(--np-fg); --mut:var(--np-mut); --card:var(--np-glass); --card2:var(--np-glass); --line:var(--np-line); --acc:var(--np-acc); --accfg:var(--np-accfg);
  --track:var(--np-track); --fill:var(--np-acc); --thumb:#fff; --tick:var(--np-mut); --font:'Plus Jakarta Sans',system-ui,sans-serif; --r:26px; }
[data-dir="playlist"] { --bg:var(--pl-bg); --fg:var(--pl-fg); --mut:var(--pl-mut); --card:var(--pl-card); --card2:var(--pl-card); --line:var(--pl-line); --acc:var(--pl-acc); --accfg:var(--pl-accfg);
  --track:var(--pl-track); --fill:var(--pl-fg); --thumb:var(--pl-fg); --tick:var(--pl-mut); --font:'Inter',system-ui,sans-serif; --r:14px; }

/* ===== Base ===== */
* { box-sizing:border-box; margin:0; }
html { -webkit-text-size-adjust:100%; scroll-padding-top:84px; scroll-padding-bottom:96px; }
html.lock { overflow:hidden; }
body { background:var(--bg,#0a0c12); color:var(--fg,#eef1f8); font:400 1rem/1.4 var(--font,system-ui); min-height:100dvh; overflow-x:hidden; -webkit-font-smoothing:antialiased; transition:background .4s,color .4s; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; text-align:inherit; }
button:disabled { cursor:default; }
ul { list-style:none; padding:0; }
:focus-visible { outline:3px solid var(--acc); outline-offset:3px; border-radius:10px; }
.wrap { max-width:640px; margin:0 auto; padding:76px 16px 48px; position:relative; z-index:1; }
small { font-size:.875rem; color:var(--mut); }
.eyebrow { font-size:.8125rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--mut); }
.foot { margin-top:28px; text-align:center; font-size:.875rem; color:var(--mut); line-height:1.55; padding:0 8px; }
.press { transition:transform .12s ease, background .2s, box-shadow .25s, opacity .2s; }
.press:active:not(:disabled) { transform:scale(.94); }

/* ===== Style switcher (dev chrome; neutral in every direction) ===== */
.sw { position:fixed; inset:0 0 auto 0; z-index:60; display:flex; justify-content:center; gap:8px; padding:10px 16px; pointer-events:none; }
.sw > * { pointer-events:auto; background:rgba(18,20,30,.88); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.16); border-radius:99px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
.seg { display:flex; padding:3px; }
.seg button, .thm { min-height:44px; padding:0 14px; border-radius:99px; color:#d3d8e8; font:700 .875rem/1 'Inter',system-ui,sans-serif; white-space:nowrap; }
.seg button[aria-pressed="true"] { background:#fff; color:#0b0d12; }
.thm { padding:0 14px; }

/* ===== Shared components ===== */
.panel { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; margin-top:14px; }
.panel h2, .ph h2 { font-size:1.125rem; font-weight:800; letter-spacing:-.01em; }
.ph { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; min-height:44px; }
.back { display:inline-flex; align-items:center; gap:4px; min-height:44px; padding:0 12px 0 6px; font-weight:700; border-radius:99px; }
.back svg { width:22px; height:22px; }
.btn { min-height:44px; padding:0 18px; border-radius:99px; border:1.5px solid var(--line); font-weight:700; font-size:.9375rem; background:transparent; }
.btn:hover:not(:disabled) { border-color:var(--mut); }
.btn:disabled { opacity:.45; }
.btn.on { background:var(--acc); color:var(--accfg); border-color:transparent; }
.transport { display:flex; align-items:center; justify-content:center; gap:22px; margin:6px 0 8px; }
.skip { width:60px; height:60px; border-radius:50%; display:grid; place-items:center; background:var(--card2); border:1px solid var(--line); }
.skip svg { width:30px; height:30px; }
.play { width:80px; height:80px; border-radius:50%; display:grid; place-items:center; background:var(--acc); color:var(--accfg); }
.play svg { width:36px; height:36px; }
.play .ic-play { transform:translateX(2px); }
.loop { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:10px; }
.loop > span { font-size:.9375rem; font-weight:600; color:var(--mut); margin-right:2px; }
.times { display:flex; justify-content:space-between; font-size:.9375rem; font-variant-numeric:tabular-nums; color:var(--mut); margin-top:-2px; gap:8px; }
.times em { font-style:normal; color:var(--acc); font-weight:700; text-align:center; }
.dim { opacity:.7; }

/* Range sliders: big thumb, filled track, notch at the 1.0 default (mid-slider) */
.rng { position:relative; display:flex; align-items:center; --pn:0; --th:8px; }
.rng input { -webkit-appearance:none; appearance:none; width:100%; height:44px; margin:0; background:transparent; position:relative; z-index:1; cursor:pointer; }
.rng input::-webkit-slider-runnable-track { height:var(--th); border-radius:99px; background:linear-gradient(to right, var(--fill) calc(var(--pn)*(100% - 28px) + 14px), var(--track) 0); }
.rng input::-moz-range-track { height:var(--th); border-radius:99px; background:var(--track); }
.rng input::-moz-range-progress { height:var(--th); border-radius:99px; background:var(--fill); }
.rng input::-webkit-slider-thumb { -webkit-appearance:none; width:28px; height:28px; border-radius:50%; margin-top:calc((var(--th) - 28px)/2); background:var(--thumb); border:0; box-shadow:0 2px 8px rgba(0,0,0,.35), 0 0 0 4px color-mix(in srgb, var(--fill) 28%, transparent); transition:transform .12s; }
.rng input::-moz-range-thumb { width:28px; height:28px; border-radius:50%; background:var(--thumb); border:0; box-shadow:0 2px 8px rgba(0,0,0,.35), 0 0 0 4px color-mix(in srgb, var(--fill) 28%, transparent); }
.rng input:active::-webkit-slider-thumb { transform:scale(1.15); }
.rng input:disabled { opacity:.4; }
.rng.mid::before { content:""; position:absolute; left:50%; top:50%; width:2px; height:16px; margin:-8px 0 0 -1px; background:var(--tick); opacity:.6; border-radius:2px; }
.loopband { position:absolute; top:50%; height:22px; margin-top:-11px; border-radius:8px; pointer-events:none; z-index:0;
  left:calc(var(--la)*(100% - 28px) + 14px); width:calc((var(--lb) - var(--la))*(100% - 28px) + 2px); background:color-mix(in srgb, var(--acc) 30%, transparent); border:1.5px solid var(--acc); }
.scrub .rng { --th:10px; }

/* Speed + picker */
.speed-h { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.speed-h h2 { margin-right:auto; }
.speed-v { font-size:1.375rem; font-weight:800; font-variant-numeric:tabular-nums; }
.ends { display:flex; justify-content:space-between; font-size:.875rem; color:var(--mut); margin-top:-4px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px; }
.chip { min-height:46px; padding:0 18px; border-radius:99px; border:1.5px solid var(--line); font-weight:700; display:inline-flex; align-items:center; gap:8px; background:var(--card2); }
.chip .dot { width:10px; height:10px; border-radius:50%; background:var(--pc); display:none; }
.chip[aria-pressed="true"] { background:var(--acc); color:var(--accfg); border-color:transparent; }
.hint { font-size:.9375rem; color:var(--mut); margin:6px 0 2px; }
.tgl { display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; min-height:60px; padding:6px 0; border-top:1px solid var(--line); }
.tgl:first-of-type { margin-top:8px; }
.tgl .tt { display:grid; }
.tgl b { font-weight:700; }
.tgl:disabled { opacity:.5; }
.sw2 { width:58px; height:34px; border-radius:99px; background:var(--track); position:relative; flex:none; transition:background .25s; }
.sw2 i { position:absolute; top:4px; left:4px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.35); transition:transform .25s cubic-bezier(.3,1.4,.5,1); }
.tgl[aria-checked="true"] .sw2 { background:var(--acc); }
.tgl[aria-checked="true"] .sw2 i { transform:translateX(24px); }

/* Part rows */
.rows { display:grid; gap:10px; }
.row { display:grid; align-items:center; gap:4px 12px; padding:10px 14px; border-radius:18px; transition:opacity .25s, background .25s; }
.row .nm { grid-area:nm; min-width:0; display:grid; }
.row .nm b { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .rng { grid-area:rng; }
.pwr { grid-area:pwr; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--line); color:var(--mut); }
.pwr svg { width:22px; height:22px; }
.pwr[aria-checked="true"] { background:var(--acc); border-color:transparent; color:var(--accfg); }
.row.off { opacity:.55; }
.row.off .nm b { text-decoration:line-through; text-decoration-thickness:1.5px; }
.meter { grid-area:meter; display:none; align-items:flex-end; gap:3px; height:20px; }
.meter i { width:4px; border-radius:2px; background:var(--pc); height:30%; }
.playing .row:not(.off) .meter i { animation:lvl .9s ease-in-out infinite alternate; }
.meter i:nth-child(2) { animation-duration:.6s !important; } .meter i:nth-child(3) { animation-duration:1.1s !important; } .meter i:nth-child(4) { animation-duration:.75s !important; }
@keyframes lvl { from { height:15%; } to { height:100%; } }

/* Cover art: deterministic gradient from the song title, no images */
.cover { --cs:56px; width:var(--cs); height:var(--cs); font-size:var(--cs); border-radius:var(--cr,.2em); flex:none; position:relative; overflow:hidden; color:#fff;
  background:radial-gradient(circle at 24% 18%, hsl(var(--ch2) 95% 72% / .95), transparent 55%), linear-gradient(var(--ca), hsl(var(--ch1) 70% 46%), hsl(var(--ch2) 78% 28%)); }
.cover::before { content:""; position:absolute; inset:0; background:repeating-radial-gradient(circle at 78% 82%, rgba(255,255,255,.14) 0 .012em, transparent .012em .085em); }
.cover .g { position:absolute; inset:0; display:grid; place-items:center; font-size:.52em; text-shadow:0 .03em .12em rgba(0,0,0,.35); font-family:system-ui,sans-serif; }
.cover small { display:block; position:absolute; left:.08em; bottom:.1em; max-width:.8em; font-size:.055em; font-weight:800; color:#fff; line-height:1.15; text-shadow:0 1px 6px rgba(0,0,0,.4); }

@keyframes eq { from { transform:scaleY(.25); } to { transform:scaleY(1); } }

/* Songs (home) */
.songs { display:grid; gap:12px; margin-top:18px; }
.song { width:100%; display:flex; align-items:center; gap:14px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); text-align:left; }
.song .si { flex:1; min-width:0; display:grid; gap:2px; }
.song b { font-size:1.1875rem; font-weight:800; letter-spacing:-.01em; }
.pchips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.pchips span { font-size:.8125rem; font-weight:600; padding:3px 10px; border-radius:99px; background:color-mix(in srgb, var(--fg) 9%, transparent); color:var(--fg); }
.dur { font-variant-numeric:tabular-nums; color:var(--mut); font-weight:600; }
.song .stripe, .song .num, .song .eqb { display:none; }
.hd h1 { font-weight:800; letter-spacing:-.03em; line-height:1.05; margin:6px 0 4px; font-size:clamp(2rem,9vw,2.75rem); }
.ptitle h1 { font-weight:800; letter-spacing:-.025em; line-height:1.1; font-size:clamp(1.75rem,8vw,2.25rem); margin:4px 0 2px; }

/* ===== 1. STUDIO: dark, stem-mixer feel ===== */
[data-dir="studio"] body { background:radial-gradient(120% 60% at 50% -10%, #1a2040 0, var(--st-bg) 60%) fixed, var(--st-bg); }
[data-dir="studio"] .panel { background:linear-gradient(180deg, var(--card2), var(--card)); box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 20px 40px rgba(0,0,0,.35); }
[data-dir="studio"] .play { width:92px; height:92px; background:linear-gradient(140deg,#6f7dff,#a45cff); color:#fff;
  box-shadow:0 0 0 10px rgba(110,120,255,.12), 0 0 0 22px rgba(110,120,255,.06), 0 14px 50px rgba(130,100,255,.6); }
[data-dir="studio"] .play svg { width:42px; height:42px; }
.playing[data-dir="studio"] .play { animation:glow 2.2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow:0 0 0 14px rgba(110,120,255,.2), 0 0 0 30px rgba(110,120,255,.05), 0 14px 70px rgba(150,100,255,.85); } }
[data-dir="studio"] .skip { background:#1f2740; }
[data-dir="studio"] .transport { margin:28px 0 26px; }
[data-dir="studio"] .scrub .rng { --fill:#9a7bff; }
[data-dir="studio"] .scrub .rng input::-webkit-slider-runnable-track { background:linear-gradient(to right,#7b84ff 0,#c26bff calc(var(--pn)*(100% - 28px) + 14px), var(--track) 0); }
[data-dir="studio"] .scrub .rng input::-moz-range-progress { background:linear-gradient(90deg,#7b84ff,#c26bff); }
[data-dir="studio"] .row { grid-template-columns:48px 1fr auto; grid-template-areas:"pwr nm meter" "rng rng rng"; background:var(--card2); border:1px solid var(--line); border-left:5px solid var(--pc); padding:12px 14px 4px; }
[data-dir="studio"] .row .rng { --fill:var(--pc); --th:12px; margin:0 -4px; }
[data-dir="studio"] .row .rng input::-webkit-slider-thumb { box-shadow:0 2px 8px rgba(0,0,0,.5), 0 0 0 4px color-mix(in srgb, var(--pc) 45%, transparent); }
[data-dir="studio"] .pwr[aria-checked="true"] { background:var(--pc); color:#0a0c12; box-shadow:0 0 18px color-mix(in srgb, var(--pc) 55%, transparent); }
[data-dir="studio"] .meter { display:flex; }
[data-dir="studio"] .chip .dot { display:block; }
[data-dir="studio"] .chip[aria-pressed="true"] { background:var(--pc); color:#0a0c12; }
[data-dir="studio"] .tgl[aria-checked="true"] .sw2 { background:#7b84ff; }
[data-dir="studio"] .song { background:linear-gradient(180deg,var(--card2),var(--card)); padding:18px; }
[data-dir="studio"] .song .stripe { display:flex; flex-direction:column; gap:4px; }
[data-dir="studio"] .song .stripe i { width:6px; height:8px; border-radius:3px; background:var(--pc); }
[data-dir="studio"] .song .cover { display:none; }
[data-dir="studio"] .song:hover { border-color:#3a4570; }
[data-dir="studio"] .hd h1 { background:linear-gradient(90deg,#fff,#b9c0ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
[data-dir="studio"] .btn.on { background:#7b84ff; }

/* ===== 2. NOW PLAYING: frosted glass over cover-colored blur ===== */
.orbs { position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; display:none; }
[data-dir="now"] .orbs { display:block; }
.orbs i { position:absolute; width:70vmax; height:70vmax; border-radius:50%; filter:blur(80px); transition:background 1s; }
.orbs i:nth-child(1) { left:-25vmax; top:-30vmax; background:hsl(var(--h1) 80% var(--np-oL) / var(--np-oA)); }
.orbs i:nth-child(2) { right:-30vmax; top:10vmax; background:hsl(var(--h2) 80% var(--np-oL) / var(--np-oA)); }
.orbs i:nth-child(3) { left:0; bottom:-40vmax; background:hsl(var(--h1) 70% var(--np-oL) / calc(var(--np-oA) * .7)); }
[data-dir="now"] .panel, [data-dir="now"] .song, [data-dir="now"] .row { -webkit-backdrop-filter:blur(26px) saturate(150%); backdrop-filter:blur(26px) saturate(150%); box-shadow:0 10px 30px rgba(30,10,80,.12), inset 0 1px 0 rgba(255,255,255,.35); }
[data-dir="now"] .row { grid-template-columns:46px 88px 1fr; grid-template-areas:"pwr nm rng"; background:var(--np-glass); border:1px solid var(--line); border-radius:20px; padding:8px 12px 8px 8px; }
[data-dir="now"] .row .rng { --th:6px; }
[data-dir="now"] .rows { gap:8px; }
[data-dir="now"] .play { width:76px; height:76px; box-shadow:0 12px 30px rgba(70,40,200,.4); }
[data-dir="now"] .skip { -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
[data-dir="now"] .chip { background:var(--np-glass); }
[data-dir="now"] .chip[aria-pressed="true"] { background:var(--acc); color:var(--accfg); }
[data-dir="now"] .song { --cr:.22em; padding:12px; }
[data-dir="now"] .song .cover { --cs:84px; box-shadow:0 10px 24px rgba(40,10,120,.3); }
[data-dir="now"] .cover { box-shadow:0 18px 50px rgba(40,10,120,.4); }
[data-dir="now"] .np-art { display:grid; justify-items:center; text-align:center; gap:2px; margin:0 0 6px; }
[data-dir="now"] .np-art .cover { --cs:min(70vw,300px); --cr:.07em; margin-bottom:18px; }
[data-dir="now"] .ptitle { text-align:center; }
[data-dir="now"] .btn { background:var(--np-glass); }
[data-dir="now"] .btn.on { background:var(--acc); }
[data-dir="now"] .hd { text-align:center; margin-bottom:6px; }
.np-art .cover { display:none; }
[data-dir="now"] .np-art .cover { display:block; }
@media (min-width:900px) {
  [data-dir="now"] .wrap.pl { max-width:1000px; }
  [data-dir="now"] .np-grid { display:grid; grid-template-columns:340px 1fr; gap:36px; align-items:start; }
  [data-dir="now"] .np-art { position:sticky; top:84px; }
  [data-dir="now"] .np-art .cover { --cs:340px; }
  [data-dir="now"] .np-grid .panel:first-child { margin-top:0; }
}

/* ===== 3. PLAYLIST: bold type, track list, mini-player, expanding player ===== */
[data-dir="playlist"] .wrap { max-width:720px; }
[data-dir="playlist"] .hd h1 { font-size:clamp(2.6rem,13vw,4.75rem); letter-spacing:-.05em; line-height:.98; font-weight:800; margin:10px 0 8px; }
[data-dir="playlist"] .hd .meta { font-weight:600; color:var(--mut); }
[data-dir="playlist"] .songs { gap:0; margin-top:26px; border-top:1px solid var(--line); }
[data-dir="playlist"] .song { background:none; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:14px 4px; gap:14px; }
[data-dir="playlist"] .song:hover { background:var(--card); }
[data-dir="playlist"] .song .num { display:block; width:22px; text-align:center; color:var(--mut); font-weight:700; font-variant-numeric:tabular-nums; }
[data-dir="playlist"] .song .cover { --cs:56px; --cr:.1em; }
[data-dir="playlist"] .song.cur b { color:var(--acc); }
[data-dir="playlist"] .song.cur .num { display:none; }

<body>
<div id="app"></div>
<script>
"use strict";
/* ===== Data (mock; same shape as the manifests, no audio) ===== */
const CHOIR = "Oak Hills 3rd Ward Choir";
const V = "voice", A = "accompaniment";
const SONGS = [
  { id: "candlelight-carol", title: "Candlelight Carol", credits: "John Rutter", dur: 213, parts: [
    ["organ","Organ",A],["soprano","Soprano",V],["alto","Alto",V],["tenor","Tenor",V],["baritone","Baritone",V],["bass","Bass",V] ] },
  { id: "example-duet", title: "Example Duet", credits: "Traditional, arr. Example", dur: 150, parts: [
    ["piano","Piano",A],["part-1","Part 1",V],["part-2","Part 2",V] ] },
].map(s => ({ ...s, parts: s.parts.map(([id, label, kind]) => ({ id, label, kind })) }));
const PALETTE = ["#ff6f91","#ffb04f","#f2e152","#58e08a","#4cd2ff","#8b8cff","#d086ff","#ff8ad4"];
const DIRS = [["studio","Studio"],["now","Now Playing"],["playlist","Playlist"]];

/* ===== Helpers ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const fmt = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const rateTxt = r => r.toFixed(2).replace(/0$/, "") + "×";
const partColor = (sg, p) => p.kind === A ? "#aab6cc" : PALETTE[sg.parts.filter(x => x.kind === V).indexOf(p) % PALETTE.length];
const hues = sg => { const h = hash(sg.title); return [h % 360, (h % 360 + 50 + (h >> 3) % 90) % 360]; };

/* ===== State + persistence (localStorage always in try/catch) ===== */
const KEY = "pbstyles.v1";
const S = { dir: "studio", theme: "auto", song: null, open: false, playing: false, t: 0, loop: { a: null, b: null }, mixes: {} };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { /* ignore */ }
S.song = null; S.open = false; S.playing = false; S.t = 0; S.loop = { a: null, b: null };   // only dir/theme/mixes persist
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ dir: S.dir, theme: S.theme, mixes: S.mixes })); } catch (e) { /* ignore */ } };
const cur = () => (S.song == null ? null : SONGS[S.song]);
function mix(sg = cur()) {
  return S.mixes[sg.id] ||= { rate: 1, my: null, louder: false, parts: Object.fromEntries(sg.parts.map(p => [p.id, { on: true, gain: 1 }])) };
}
const isDefault = sg => { const m = mix(sg); return !m.my && !m.louder && sg.parts.every(p => m.parts[p.id].on && m.parts[p.id].gain === 1); };

/* ===== Mixer rules (the mixer is the truth; the picker is a shortcut that sets it) ===== */
function pick(sg, id) {
  const m = mix(sg), p = sg.parts.find(x => x.id === id);
  if (m.my === id) { m.my = null; m.louder = false; return; }
  m.my = id;
  for (const q of sg.parts) {
    const st = m.parts[q.id];
    if (q.id === id) st.on = true;
    else if (p.kind === V) { if (q.kind === V) st.on = false; }   // a voice pick mutes other voices, leaves accompaniment
    else st.on = false;                                           // an accompaniment pick hears just that part
  }
}
function toggleAcc(sg) {
  const m = mix(sg), acc = sg.parts.filter(p => p.kind === A), on = !acc.some(p => m.parts[p.id].on);
  acc.forEach(p => { m.parts[p.id].on = on; });
}

/* ===== Icons ===== */
const svg = (b, x = "") => `<svg viewBox="0 0 24 24" aria-hidden="true" ${x}>${b}</svg>`;
const stroke = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const IC = {
  play: svg('<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" fill="currentColor"/>', 'class="ic-play"'),
  pause: svg('<rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/>'),
  back: svg(`<g ${stroke}><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.2 3.5v4h4"/></g><text x="12" y="15.2" font-size="7.4" font-weight="800" text-anchor="middle" fill="currentColor" font-family="Inter,system-ui,sans-serif">10</text>`),
  fwd: svg(`<g ${stroke} transform="matrix(-1 0 0 1 24 0)"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.2 3.5v4h4"/></g><text x="12" y="15.2" font-size="7.4" font-weight="800" text-anchor="middle" fill="currentColor" font-family="Inter,system-ui,sans-serif">10</text>`),
  on: svg(`<path d="M4 9.5v5h3.6L12.5 18.5v-13L7.6 9.5H4Z" fill="currentColor"/><path d="M16 9a4.2 4.2 0 0 1 0 6M18.6 6.4a8 8 0 0 1 0 11.2" ${stroke}/>`),
  off: svg(`<path d="M4 9.5v5h3.6L12.5 18.5v-13L7.6 9.5H4Z" fill="currentColor"/><path d="m16 9.5 5 5m0-5-5 5" ${stroke}/>`),
  chev: svg(`<path d="m15 5-7 7 7 7" ${stroke}/>`),
  down: svg(`<path d="m5 9 7 7 7-7" ${stroke}/>`),
};

/* ===== Shared markup blocks ===== */
function cover(sg, big) {
  const [h1, h2] = hues(sg), h = hash(sg.title);
  return `<div class="cover ${big || ""}" style="--ch1:${h1};--ch2:${h2};--ca:${(h % 8) * 45 + 20}deg" aria-hidden="true"><span class="g">${"♪♫♬♩"[h % 4]}</span>${big === "lg" ? `<small>${sg.title}</small>` : ""}</div>`;
}
const playBtn = () => `<button class="play press" data-act="play" data-k="play" aria-label="${S.playing ? "Pause" : "Play"}">${S.playing ? IC.pause : IC.play}</button>`;
const skipBtn = d => `<button class="skip press" data-act="skip" data-v="${d}" data-k="skip${d}" aria-label="${d < 0 ? "Back 10 seconds" : "Forward 10 seconds"}">${d < 0 ? IC.back : IC.fwd}</button>`;
const transport = () => `<div class="transport">${skipBtn(-10)}${playBtn()}${skipBtn(10)}</div>`;
function scrub(sg) {
  const { a, b } = S.loop, n = x => (x / sg.dur).toFixed(4);
  const band = a != null ? `<i class="loopband" style="--la:${n(a)};--lb:${b != null ? n(b) : n(Math.min(sg.dur, a + 0.8))}"></i>` : "";
  const txt = a != null || b != null ? `<em>Repeating ${a != null ? fmt(a) : "…"} – ${b != null ? fmt(b) : "…"}</em>` : "";
  return `<div class="scrub"><div class="rng" style="--pn:${n(S.t)}">${band}<input type="range" data-r="scrub" data-b="scrub" data-k="scrub" min="0" max="${sg.dur}" step="0.1" value="${S.t}" aria-label="Song position" aria-valuetext="${fmt(S.t)} of ${fmt(sg.dur)}"></div>
  <div class="times"><span data-b="el">${fmt(S.t)}</span>${txt}<span>${fmt(sg.dur)}</span></div></div>`;
}
function loopHtml() {
  const { a, b } = S.loop;
  return `<div class="loop" role="group" aria-label="Repeat a section"><span>Repeat section</span>
  <button class="btn press ${a != null ? "on" : ""}" data-act="la" data-k="la">Start here</button>
  <button class="btn press ${b != null ? "on" : ""}" data-act="lb" data-k="lb">End here</button>
  <button class="btn press" data-act="lc" data-k="lc" ${a == null && b == null ? "disabled" : ""}>Clear</button></div>`;
}
function speedHtml(sg) {
  const r = mix(sg).rate;
  return `<div class="speed-h"><h2>Speed</h2><span class="speed-v" aria-live="polite">${rateTxt(r)}</span><button class="btn press" data-act="norm" data-k="norm" ${r === 1 ? "disabled" : ""}>Normal</button></div>
  <div class="rng mid" style="--pn:${r - 0.5}"><input type="range" data-r="speed" data-k="speed" min="0.5" max="1.5" step="0.05" value="${r}" aria-label="Speed" aria-valuetext="${rateTxt(r)}"></div>
  <div class="ends"><span>Slower</span><span>Faster</span></div>`;
}
const toggle = (act, label, hint, on, dis) => `<button class="tgl" role="switch" aria-checked="${on}" data-act="${act}" data-k="${act}" ${dis ? "disabled" : ""}><span class="tt"><b>${label}</b><small>${hint}</small></span><span class="sw2" aria-hidden="true"><i></i></span></button>`;
function pickerHtml(sg) {
  const m = mix(sg), acc = sg.parts.filter(p => p.kind === A);
  const ordered = [...sg.parts.filter(p => p.kind === V), ...acc];
  return `<div class="chips" role="group" aria-label="Which part do you sing?">${ordered.map(p =>
    `<button class="chip press" style="--pc:${partColor(sg, p)}" aria-pressed="${m.my === p.id}" data-act="pick" data-id="${p.id}" data-k="pick-${p.id}"><span class="dot"></span>${p.label}</button>`).join("")}</div>
  <p class="hint" aria-live="polite">${m.my ? "Your part is on and the other voices are off. Add any part back below." : "Pick your part and the other voices turn off."}</p>
  ${acc.length ? toggle("acc", acc.map(p => p.label).join(" & "), "Accompaniment", acc.some(p => m.parts[p.id].on)) : ""}
  ${toggle("louder", "Everyone, my part louder", m.my ? "Plays all parts; the others are quieter" : "Pick your part first", m.louder, !m.my)}`;
}
function rowHtml(sg, p) {
  const m = mix(sg), st = m.parts[p.id], mine = m.my === p.id;
  const sub = !st.on ? "Off" : mine ? "Your part" : m.louder && m.my ? "Quieter" : p.kind === A ? "Backing" : "Playing";
  return `<li class="row ${st.on ? "" : "off"}" style="--pc:${partColor(sg, p)}">
  <button class="pwr press" role="switch" aria-checked="${st.on}" aria-label="${p.label}" data-act="part" data-id="${p.id}" data-k="pw-${p.id}">${st.on ? IC.on : IC.off}</button>
  <div class="nm"><b>${p.label}</b><small>${sub}</small></div>
  <span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <div class="rng mid" style="--pn:${st.gain / 2}"><input type="range" data-r="gain" data-id="${p.id}" data-k="g-${p.id}" min="0" max="2" step="0.05" value="${st.gain}" ${st.on ? "" : "disabled"} aria-label="${p.label} volume" aria-valuetext="${Math.round(st.gain * 100)}%"></div></li>`;
}
const resetBtn = sg => `<button class="btn press" data-act="reset" data-k="reset" ${isDefault(sg) ? "disabled" : ""}>Reset mix</button>`;
const rowsHtml = sg => `<ul class="rows">${sg.parts.map(p => rowHtml(sg, p)).join("")}</ul>`;
const footer = `<footer class="foot">For your own private practice only. Music is copyrighted by its owners; please don’t share or download these tracks.</footer>`;
const total = () => fmt(SONGS.reduce((n, s) => n + s.dur, 0));

function songItem(i) {
  const sg = SONGS[i], is = S.song === i;
  return `<li><button class="song press ${is ? "cur" : ""}" data-act="open" data-i="${i}" data-k="song${i}">
    <span class="num">${i + 1}</span><span class="eqb" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="stripe" aria-hidden="true">${sg.parts.map(p => `<i style="--pc:${partColor(sg, p)}"></i>`).join("")}</span>
    ${cover(sg)}
    <span class="si"><b>${sg.title}</b><small>${sg.credits}${S.dir === "playlist" ? " · " + sg.parts.map(p => p.label).join(", ") : ""}</small>
      <span class="pchips">${sg.parts.map(p => `<span>${p.label}</span>`).join("")}</span></span>
    <span class="dur">${fmt(sg.dur)}</span></button></li>`;
}
const home = () => `<main class="wrap"><header class="hd"><p class="eyebrow">${S.dir === "playlist" ? "Playlist · Choir practice" : "Choir practice"}</p><h1>${CHOIR}</h1>
  <p class="meta"><small>${SONGS.length} songs · ${total()}</small></p></header><ul class="songs">${SONGS.map((_, i) => songItem(i)).join("")}</ul>${footer}</main>`;

/* ===== Direction layouts ===== */
const backBar = `<div class="top"><button class="back press" data-act="back" data-k="back">${IC.chev} Songs</button><span class="eyebrow">Practice Buddy</span></div>`;
function studioPlayer(sg) {
  return `<main class="wrap">${backBar}<header class="ptitle"><p class="eyebrow">Now practicing</p><h1>${sg.title}</h1><small>${sg.credits}</small></header>
  <section class="panel">${scrub(sg)}${transport()}${loopHtml()}</section>
  <section class="panel">${speedHtml(sg)}</section>
  <section class="panel"><h2>Which part do you sing?</h2>${pickerHtml(sg)}</section>
  <section class="panel"><div class="ph"><h2>Mix</h2>${resetBtn(sg)}</div>${rowsHtml(sg)}</section>${footer}</main>`;
}
function nowPlayer(sg) {
  return `<main class="wrap pl">${backBar}<div class="np-grid"><div class="np-art">${cover(sg, "lg")}<header class="ptitle"><h1>${sg.title}</h1><small>${sg.credits}</small></header></div>
  <div><section class="panel">${scrub(sg)}${transport()}${loopHtml()}</section>
  <section class="panel">${speedHtml(sg)}</section>
  <section class="panel"><h2>Which part do you sing?</h2>${pickerHtml(sg)}</section>
  <section class="panel"><div class="ph"><h2>Mix</h2>${resetBtn(sg)}</div>${rowsHtml(sg)}</section></div></div>${footer}</main>`;
}
function playlistLayer(sg) {
  if (!sg) return "";
  return `<div class="mini" ${S.open ? "inert aria-hidden=\"true\"" : ""}><div class="bar" style="--pn:${(S.t / sg.dur).toFixed(4)}" data-b="prog"><i></i></div>
    <div class="mrow"><button class="mopen press" data-act="open" data-i="${S.song}" data-k="mini" aria-label="Open player for ${sg.title}">${cover(sg)}<span class="mt"><b>${sg.title}</b><small>${sg.credits} · <span data-b="el">${fmt(S.t)}</span></small></span></button>
    <button class="mp press" data-act="play" data-k="mp" aria-label="${S.playing ? "Pause" : "Play"}">${S.playing ? IC.pause : IC.play}</button></div></div>
  <div class="sheet ${S.open ? "open" : ""}" role="dialog" aria-label="Player: ${sg.title}" ${S.open ? "" : "inert aria-hidden=\"true\""}><div class="wrap">
    <div class="top"><button class="back press" data-act="close" data-k="collapse" aria-label="Collapse player">${IC.down} Playlist</button><span class="eyebrow">Now playing</span></div>
    ${cover(sg, "xl")}<header class="ptitle"><h1>${sg.title}</h1><small>${sg.credits}</small></header>
    <section class="panel" style="border-top:0">${scrub(sg)}${transport()}${loopHtml()}</section>
    <section class="panel">${speedHtml(sg)}</section>
    <section class="panel"><h2>Which part do you sing?</h2>${pickerHtml(sg)}</section>
    <section class="panel"><div class="ph"><h2>Mix</h2>${resetBtn(sg)}</div>${rowsHtml(sg)}</section>${footer}</div></div>`;
}
const switcher = () => `<nav class="sw" aria-label="Visual style"><div class="seg">${DIRS.map(([id, n]) =>
  `<button class="press" aria-pressed="${S.dir === id}" data-act="dir" data-v="${id}" data-k="dir-${id}">${n}</button>`).join("")}</div>
  <button class="thm press" data-act="theme" data-k="theme" ${S.dir === "studio" ? "disabled" : ""} aria-label="Color mode: ${S.dir === "studio" ? "dark only" : S.theme}">${S.dir === "studio" ? "Dark only" : { auto: "Auto", light: "Light", dark: "Dark" }[S.theme]}</button></nav>`;

function html() {
  const sg = cur(), d = S.dir;
  let main;
  if (d === "studio") main = S.open && sg ? studioPlayer(sg) : home();
  else if (d === "now") main = S.open && sg ? nowPlayer(sg) : home();
  else main = home().replace("<footer", `<div style="height:${sg ? 84 : 0}px"></div><footer`) + playlistLayer(sg);
  return `<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>${switcher()}${main}`;
}

/* ===== Render: full replace when the screen changes, otherwise morph in place (keeps focus, drags and transitions) ===== */
function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b.cloneNode(true)); return; }
  if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; return; }
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for (const at of b.attributes) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  if (a.nodeName === "INPUT" && a !== dragEl) a.value = b.value;
  const ac = [...a.childNodes], bc = [...b.childNodes];
  bc.forEach((n, i) => (ac[i] ? morph(ac[i], n) : a.appendChild(n.cloneNode(true))));
  ac.slice(bc.length).forEach(n => n.remove());
}
let dragEl = null, lastKey = "";
const root = $("#app");
function render() {
  const sg = cur(), el = document.documentElement, [h1, h2] = sg ? hues(sg) : [262, 318];
  el.dataset.dir = S.dir;
  if (S.theme === "auto") el.removeAttribute("data-theme"); else el.dataset.theme = S.theme;
  el.style.setProperty("--h1", h1); el.style.setProperty("--h2", h2);
  el.classList.toggle("playing", S.playing);
  el.classList.toggle("lock", S.dir === "playlist" && S.open);
  const key = S.dir + (S.dir === "playlist" ? "" : S.open ? "p" + S.song : "h");
  const next = html();
  if (key !== lastKey) { root.innerHTML = next; if (lastKey) window.scrollTo(0, 0); }
  else { const tmp = document.createElement("div"); tmp.innerHTML = next; [...root.childNodes].forEach((n, i) => tmp.childNodes[i] ? morph(n, tmp.childNodes[i]) : n.remove()); [...tmp.childNodes].slice(root.childNodes.length).forEach(n => root.appendChild(n)); }
  lastKey = key;
}
function tick() {
  const sg = cur(); if (!sg) return;
  $$("[data-b=el]").forEach(e => { e.textContent = fmt(S.t); });
  $$("[data-b=scrub]").forEach(i => { if (i !== dragEl) i.value = S.t; i.parentElement.style.setProperty("--pn", (S.t / sg.dur).toFixed(4)); i.setAttribute("aria-valuetext", fmt(S.t) + " of " + fmt(sg.dur)); });
  $$("[data-b=prog]").forEach(e => e.style.setProperty("--pn", (S.t / sg.dur).toFixed(4)));
}

/* ===== Fake playback (no audio): position advances with the clock, scaled by speed, with A–B repeat ===== */
let last = performance.now();
setInterval(() => {
  const n = performance.now(), dt = (n - last) / 1000; last = n;
  const sg = cur(); if (!sg || !S.playing) return;
  let t = S.t + dt * mix(sg).rate; const { a, b } = S.loop;
  if (a != null && b != null && S.t < b && t >= b) t = a + ((t - a) % (b - a));
  if (t >= sg.dur) { S.t = sg.dur; S.playing = false; tick(); render(); return; }
  S.t = t; tick();
}, 100);

/* ===== Events ===== */
function act(a, d) {
  const sg = cur(), m = sg && mix(sg);
  switch (a) {
    case "dir": S.dir = d.v; break;
    case "theme": S.theme = { auto: "light", light: "dark", dark: "auto" }[S.theme]; break;
    case "open": { const i = +d.i; if (S.song !== i) { S.song = i; S.t = 0; S.playing = false; S.loop = { a: null, b: null }; } S.open = true; break; }
    case "back": S.open = false; S.playing = false; break;
    case "close": S.open = false; break;
    case "play": if (!S.playing && S.t >= sg.dur) S.t = 0; S.playing = !S.playing; break;
    case "skip": S.t = clamp(S.t + +d.v, 0, sg.dur); break;
    case "la": { const t = S.t, { b } = S.loop; S.loop = b != null && t >= b ? { a: b, b: t } : { a: t, b }; break; }
    case "lb": { const t = S.t, { a: x } = S.loop; S.loop = x != null && t <= x ? { a: t, b: x } : { a: x, b: t }; break; }
    case "lc": S.loop = { a: null, b: null }; break;
    case "norm": m.rate = 1; break;
    case "pick": pick(sg, d.id); break;
    case "acc": toggleAcc(sg); break;
    case "louder": if (m.my) m.louder = !m.louder; break;
    case "part": m.parts[d.id].on = !m.parts[d.id].on; break;
    case "reset": m.my = null; m.louder = false; sg.parts.forEach(p => { m.parts[p.id] = { on: true, gain: 1 }; }); break;
  }
  save(); render();
  if (a === "open" && S.dir === "playlist") $("[data-k=collapse]")?.focus({ preventScroll: true });
  if (a === "close") $("[data-k=mini]")?.focus({ preventScroll: true });
}
root.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el && !el.disabled) act(el.dataset.act, el.dataset); });
root.addEventListener("pointerdown", e => { if (e.target.matches("input[type=range]")) dragEl = e.target; });
["pointerup", "pointercancel"].forEach(ev => addEventListener(ev, () => { dragEl = null; }));
root.addEventListener("input", e => {
  const i = e.target, sg = cur(); if (!i.dataset.r) return;
  let v = +i.value;
  if (i.dataset.r === "scrub") { S.t = v; i.setAttribute("aria-valuetext", fmt(v) + " of " + fmt(sg.dur)); $$("[data-b=el]").forEach(x => { x.textContent = fmt(v); }); i.parentElement.style.setProperty("--pn", v / sg.dur); return; }
  if (i.dataset.r === "speed") {
    if (Math.abs(v - 1) <= 0.03) { v = 1; i.value = 1; }
    mix(sg).rate = v; i.parentElement.style.setProperty("--pn", v - 0.5); i.setAttribute("aria-valuetext", rateTxt(v));
    $(".speed-v", i.closest(".sheet") || document).textContent = rateTxt(v);
    $$("[data-act=norm]").forEach(b => { b.disabled = v === 1; });
  } else {
    mix(sg).parts[i.dataset.id].gain = v; i.parentElement.style.setProperty("--pn", v / 2); i.setAttribute("aria-valuetext", Math.round(v * 100) + "%");
    $$("[data-act=reset]").forEach(b => { b.disabled = isDefault(sg); });
  }
  save();
});
addEventListener("keydown", e => { if (e.key === "Escape" && S.dir === "playlist" && S.open) act("close", {}); });

/* Deep links for the reviewer: #studio, #now/0, #playlist/1 (song index opens the player) */
{
  const [d, i] = location.hash.slice(1).split("/");
  if (DIRS.some(x => x[0] === d)) S.dir = d;
  if (i != null && SONGS[+i]) { S.song = +i; S.open = true; }
}
render();
</script>
